<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Current</title>
<link rel="stylesheet" href="main.css">
<style>
.msg-bubble.search-match { outline: 2px solid var(--accent); }
#msg-search-bar { display:none; align-items:center; gap:8px; padding:8px 16px; border-bottom:1px solid var(--border); background:var(--glass2); }
#msg-search-bar input { flex:1; padding:7px 14px; border-radius:999px; border:1px solid var(--border); background:var(--glass); color:var(--text); font-size:13px; outline:none; }
#pin-bar { display:none; align-items:center; justify-content:space-between; padding:8px 16px; border-bottom:1px solid var(--border); background:rgba(24,169,107,.06); }
.reaction-chip.mine { border-color: var(--accent); }
</style>
</head>
<body>

<div class="app">
  <!-- ── Sidebar ── -->
  <aside class="sidebar glass" id="sidebar">
    <div class="sidebar-top">
      <div class="brand"><span>◉</span> Current</div>
      <button class="button icon-btn" id="new-chat-btn" title="New chat">✏️</button>
      <button class="button icon-btn" id="sidebar-settings" title="Settings">⚙️</button>
      <button class="button icon-btn" id="theme-btn" title="Toggle theme">🌙</button>
    </div>
    <div class="search-wrap">
      <input id="search-input" placeholder="Search conversations…" autocomplete="off">
    </div>
    <div class="chat-list" id="chat-list">
      <div style="padding:20px;color:var(--muted);font-size:13px;text-align:center">Loading…</div>
    </div>
    <div style="padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center">
      <div class="avatar sm" id="my-avatar"></div>
      <div style="flex:1;min-width:0">
        <strong id="my-username" style="font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">—</strong>
      </div>
      <button class="button icon-btn" id="signout-btn" title="Sign out">🚪</button>
    </div>
  </aside>

  <!-- ── Main ── -->
  <div id="main-area" style="display:flex;flex:1;overflow:hidden">

    <div class="empty-state" id="empty-state">
      <div class="icon">◉</div>
      <h3>Current</h3>
      <p>Select a conversation or start a new one.</p>
      <span class="e2ee-badge">🔐 End-to-end encrypted</span>
    </div>

    <section class="conversation" id="conversation-pane" style="display:none;flex:1">
      <header class="conv-header glass">
        <button class="button icon-btn" id="mobile-back" style="display:none">←</button>
        <div class="avatar sm" id="conv-avatar"></div>
        <div class="conv-header-info">
          <strong id="conv-name">—</strong>
          <small id="conv-status">—</small>
        </div>
        <span class="e2ee-badge">🔐 E2EE</span>
        <div class="conv-header-actions">
          <button class="button icon-btn" id="conv-search-btn" title="Search messages">🔍</button>
          <button class="button icon-btn" id="conv-disappear-btn" title="Disappearing messages">⏳</button>
          <button class="button icon-btn" id="conv-block-btn" title="Block">🚫</button>
          <button class="button icon-btn" id="conv-info-btn" title="Info">ℹ️</button>
        </div>
      </header>

      <div id="msg-search-bar">
        <input id="msg-search-input" placeholder="Search messages…" autocomplete="off">
        <button class="button ghost sm" onclick="document.getElementById('msg-search-bar').style.display='none'"><span>✕</span></button>
      </div>

      <div id="pin-bar"></div>

      <div class="messages-area" id="messages"></div>

      <div id="typing-area" style="display:none;padding:0 20px 4px">
        <div class="typing-indicator">
          <div class="typing-dots"><span></span><span></span><span></span></div>
          <span id="typing-label" style="margin-left:6px;font-size:12px;color:var(--muted)"></span>
        </div>
      </div>

      <div class="composer glass">
        <div class="composer-input-wrap">
          <div id="reply-banner" style="display:none" class="reply-banner">
            Replying to <strong id="reply-name"></strong>: <span id="reply-preview"></span>
            <button class="close-reply" id="cancel-reply">✕</button>
          </div>
          <div class="emoji-bar">
            <button class="emoji-quick" data-emoji="👍">👍</button>
            <button class="emoji-quick" data-emoji="❤️">❤️</button>
            <button class="emoji-quick" data-emoji="😂">😂</button>
            <button class="emoji-quick" data-emoji="😮">😮</button>
            <button class="emoji-quick" data-emoji="🙏">🙏</button>
            <button class="emoji-quick" data-emoji="🔥">🔥</button>
          </div>
          <textarea id="messageInput" placeholder="Message… (Enter to send, Shift+Enter for newline)" rows="1" autocomplete="off"></textarea>
        </div>
        <button class="button accent" id="send"><span>Send</span></button>
      </div>
    </section>
  </div>
</div>

<!-- New Chat Modal -->
<div class="modal-backdrop" id="new-chat-modal" style="display:none">
  <div class="modal">
    <h2>New conversation</h2>
    <p>Find a user by their username.</p>
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="nc-username" placeholder="e.g. alex_p" autocomplete="off" spellcheck="false">
    </div>
    <div id="nc-result"></div>
    <div class="modal-actions">
      <button class="button ghost" id="nc-cancel"><span>Cancel</span></button>
      <button class="button accent" id="nc-start"><span>Start chat</span></button>
    </div>
  </div>
</div>

<!-- Disappearing messages modal -->
<div class="modal-backdrop" id="disappear-modal" style="display:none">
  <div class="modal">
    <h2>⏳ Disappearing messages</h2>
    <p>New messages will auto-delete after:</p>
    <div class="form-group">
      <label>Duration</label>
      <select id="disappear-select">
        <option value="">Off</option>
        <option value="5">5 seconds</option>
        <option value="60">1 minute</option>
        <option value="3600">1 hour</option>
        <option value="86400">24 hours</option>
        <option value="604800">1 week</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="button ghost" id="disappear-cancel"><span>Cancel</span></button>
      <button class="button accent" id="disappear-save"><span>Save</span></button>
    </div>
  </div>
</div>

<!-- Context menu -->
<div class="ctx-menu" id="ctx-menu" style="display:none">
  <button id="ctx-reply">↩️ Reply</button>
  <button id="ctx-react">😊 React</button>
  <button id="ctx-copy">📋 Copy</button>
  <button id="ctx-pin">📌 Pin message</button>
  <button id="ctx-delete" class="danger">🗑 Delete for everyone</button>
</div>

<!-- Reaction picker -->
<div class="ctx-menu" id="reaction-picker" style="display:none;flex-direction:row;padding:8px 12px;gap:4px">
  <button class="emoji-quick" data-emoji="👍">👍</button>
  <button class="emoji-quick" data-emoji="❤️">❤️</button>
  <button class="emoji-quick" data-emoji="😂">😂</button>
  <button class="emoji-quick" data-emoji="😮">😮</button>
  <button class="emoji-quick" data-emoji="🙁">🙁</button>
  <button class="emoji-quick" data-emoji="🔥">🔥</button>
</div>

<div id="toast-container"></div>
<script type="module" src="main.js"></script>
</body>
</html>
