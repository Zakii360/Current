<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Current</title>

<link rel="stylesheet" href="main.css">
<link rel="stylesheet" href="responsive.css">

</head>


<body>


<div class="app">


<aside class="sidebar glass">


<div class="brand">

<span>◉</span> Current

</div>



<div class="profile-box">


<div class="avatar"></div>


<div>

<strong>
Your Account
</strong>

<br>

<small>
Online
</small>

</div>


</div>



<button class="button">

<span>
New chat
</span>

</button>



<div class="chat-list">


<div class="chat-item active">

<div class="avatar small"></div>


<div>

<strong>
Alex
</strong>

<p>
Last message preview
</p>

</div>


</div>



</div>



<a href="settings.html">
Settings
</a>


</aside>





<section class="conversation">


<header class="conversation-header glass">


<div class="avatar small"></div>


<div>

<strong>
Alex
</strong>

<br>

<small>
online
</small>


</div>


</header>





<div class="messages-area" id="messages">


<div class="message left">

Hey! Welcome to Current.

</div>



<div class="message right">

This is the real messenger UI.

</div>



</div>





<div class="composer glass">


<input 
id="messageInput"
placeholder="Message..."
autocomplete="off">


<button 
class="button"
id="send">

<span>
Send
</span>

</button>


</div>


</section>


</div>




<script type="module" src="main.js"></script>


</body>

</html>
